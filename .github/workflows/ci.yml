# CI: ruff check, ruff format --check, pytest. The same gate a developer runs
# locally with `make lint test`, on the same paths.
#
# The suite runs on synthetic data and never touches the dataset, so the runner
# needs neither the download nor its 311 MB.
#
# The environment comes from uv.lock and nothing else: `uv sync --locked` fails
# outright if the lock and pyproject.toml disagree, so a new dependency reaches
# CI the moment it is added, and the runner builds the same environment as a
# developer, Python version included (.python-version).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Major tag, which this action does publish.
      - uses: actions/checkout@v7

      # Full version: this action publishes no moving major tag.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format (ruff)
        run: uv run ruff format --check src tests scripts

      - name: Tests
        run: uv run pytest -q
